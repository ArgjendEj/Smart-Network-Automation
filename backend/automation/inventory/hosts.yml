# Sample Ansible inventory for the network lab (GNS3 / Packet Tracer / EVE-NG).
# The platform generates a per-deploy inventory automatically under
# backend/automation/generated/ — this file is a static reference.
all:
  vars:
    ansible_connection: network_cli
    ansible_network_os: ios
    ansible_become: true
    ansible_become_method: enable
  children:
    routers:
      hosts:
        R1:
          ansible_host: 192.168.10.2
          ansible_user: admin
          ansible_password: cisco
          ansible_become_password: cisco
    switches:
      hosts:
        SW1:
          ansible_host: 192.168.10.3
          ansible_user: admin
          ansible_password: cisco
          ansible_become_password: cisco

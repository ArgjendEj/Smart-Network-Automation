---
# Full auto-configuration: apply the generated per-device config file.
# The platform generates <host>.cfg + <host>.inventory.yml + <host>.playbook.yml
# under backend/automation/generated/. This playbook is the generic equivalent:
#   ansible-playbook -i generated/<host>.inventory.yml auto_configure.yml \
#       -e "config_file=generated/<host>.cfg"
- name: Apply generated configuration
  hosts: all
  gather_facts: false
  tasks:
    - name: Push configuration from generated file
      cisco.ios.ios_config:
        src: "{{ config_file }}"
        save_when: modified
      register: result

    - name: Show change summary
      ansible.builtin.debug:
        var: result.commands

---
# Configure a single-area OSPF process on the router.
# extra-vars example:
#   {"process_id": 1,
#    "networks": [{"network": "10.10.1.0", "wildcard": "0.0.0.255", "area": "0"}]}
- name: Configure OSPF
  hosts: routers
  gather_facts: false
  tasks:
    - name: Apply OSPF process and network statements
      cisco.ios.ios_config:
        lines:
          - "network {{ item.network }} {{ item.wildcard }} area {{ item.area }}"
        parents: "router ospf {{ process_id | default(1) }}"
        save_when: modified
      loop: "{{ networks | default([]) }}"
      loop_control:
        label: "{{ item.network }}"
